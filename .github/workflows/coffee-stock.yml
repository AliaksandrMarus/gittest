name: Учёт кофейного автомата — сборка CoffeeStock

# Прогоняет тесты, собирает программу для Windows вместе с Tesseract
# (распознавание сканов накладных без интернета) и выкладывает её в Releases
# как CoffeeStock.zip с тегом coffee-stock-v1.0.N. Установленная программа
# сама находит новый выпуск и обновляется (coffee_stock/updater.py).

on:
  push:
    paths:
      - "coffee-stock/**"
      - ".github/workflows/coffee-stock.yml"
  workflow_dispatch:

permissions:
  contents: write  # создание выпуска (Release) с архивом программы

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: coffee-stock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coffee-stock/requirements*.txt

      - name: Tesseract с русским языком
        run: |
          choco install tesseract -y --no-progress
          $tess = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata/raw/main/rus.traineddata" -OutFile "$tess\tessdata\rus.traineddata"
          & "$tess\tesseract.exe" --list-langs

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q -rs

      - name: Номер версии
        run: |
          $version = "1.0.${{ github.run_number }}"
          "VERSION = `"$version`"" | Out-File -Encoding utf8 coffee_stock\_version.py
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Сборка
        run: |
          pyinstaller --noconfirm --onedir --windowed --name CoffeeStock --collect-data pdfminer run.py
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" dist\CoffeeStock\tesseract
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\CoffeeStock\tesseract\doc
          Get-ChildItem dist\CoffeeStock\tesseract\tessdata

      - name: Проверка, что собранная программа видит Tesseract
        run: |
          python -c "import sys; sys.frozen=True; sys.executable=r'dist\CoffeeStock\CoffeeStock.exe'; from coffee_stock import ocr; p=ocr.find_tesseract(); print(p); assert p and 'CoffeeStock' in str(p)"

      - name: Архив
        run: Compress-Archive -Path dist\CoffeeStock\* -DestinationPath dist\CoffeeStock.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CoffeeStock
          path: coffee-stock/dist/CoffeeStock/

      - name: Выпуск (Release) для автообновления
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = git log -1 --pretty=%B | Select-String -NotMatch "Co-Authored-By|Claude-Session" | Out-String
          gh release create "coffee-stock-v$env:VERSION" dist\CoffeeStock.zip `
            --title "Учёт кофейного автомата $env:VERSION" --notes "$notes" --target "$env:GITHUB_SHA"
